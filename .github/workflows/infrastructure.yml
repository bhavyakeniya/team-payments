# Generated by the platform. Teams maintain JSON, not these implementation steps.
name: Team infrastructure
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment directory to plan/apply (dev, staging, prod, or another registered name)
        type: string
        required: true
        default: dev
      mode:
        description: Plan only, or create and apply a fresh saved plan
        type: choice
        options: [check, plan, apply]
        default: plan
      localstack:
        description: Run isolated LocalStack Hobby integration; select mode=check to avoid AWS
        type: boolean
        default: false
      allow-destroy:
        description: Allow deletion/replacement in this manual apply
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  infrastructure:
    uses: bhavyakeniya/terraform-platform-abstraction/.github/workflows/team-infrastructure.yml@50342cd5c45fec331297e82bd784a2a477b451e2
    with:
      platform-repository: bhavyakeniya/terraform-platform-abstraction
      platform-ref: 50342cd5c45fec331297e82bd784a2a477b451e2
      environment: ${{ inputs.environment || '' }}
      # Automatic runs (push, pull_request) stay credential-free: 'check'
      # validates every changed environment without AWS. Plan and apply are
      # deliberately manual -- dispatch this workflow and choose the mode.
      mode: ${{ inputs.mode || 'check' }}
      allow-destroy: ${{ inputs.allow-destroy || false }}
      localstack: ${{ inputs.localstack || false }}
    secrets:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
